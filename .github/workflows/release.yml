name: Release

on:
  push:
    tags: ['v*']
  # A run started by hand builds the packages and keeps them with the run,
  # without releasing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev
      - name: Versions agree, and match the tag when there is one
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ./scripts/check-version.sh "$GITHUB_REF_NAME"
          else
            ./scripts/check-version.sh
          fi
      - run: cargo test
      - run: pnpm --dir gui install --frozen-lockfile
      - run: pnpm --dir gui check
      - run: pnpm --dir gui build
      - run: cargo test --manifest-path gui/src-tauri/Cargo.toml

  linux:
    needs: verify
    # An old release, so the packages run on every distribution newer than it.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev
      - name: Build the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: packaging/build-packages.sh
      - name: Checksums and update feed
        run: |
          cd gui/src-tauri/target/release/bundle
          sha256sum rpm/*.rpm deb/*.deb | sed 's# [a-z]*/# #' > SHA256SUMS
          # Only a signed build has the feed. A run started by hand has no tag.
          if ls deb/*.sig rpm/*.sig >/dev/null 2>&1; then
            tag=$GITHUB_REF_NAME
            [ "$GITHUB_REF_TYPE" = tag ] || tag="v$(node -p "require('$GITHUB_WORKSPACE/gui/package.json').version")"
            "$GITHUB_WORKSPACE/scripts/latest-json.sh" "$tag" deb rpm > latest.json
            cat latest.json
          else
            echo "No signatures: installed copies will not be offered this release"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          if-no-files-found: error
          path: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/deb/*.sig
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/rpm/*.sig
            gui/src-tauri/target/release/bundle/SHA256SUMS
            gui/src-tauri/target/release/bundle/latest.json
      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd gui/src-tauri/target/release/bundle
          files=(rpm/*.rpm deb/*.deb)
          if [ -f latest.json ]; then files+=(rpm/*.sig deb/*.sig latest.json); fi
          bash "$GITHUB_WORKSPACE/scripts/attach-to-release.sh" SHA256SUMS "${files[@]}"
