[package]
name = "familiar-gui"
description = "Familiar: settings app for Logitech MX mice"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[[bin]]
name = "familiar-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = { version = "0.3", default-features = false }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
familiar-client = { path = "../../crates/familiar-client" }
familiar-core = { path = "../../crates/familiar-core" }
hidpp = { package = "familiar-hidpp", path = "../../crates/familiar-hidpp" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
